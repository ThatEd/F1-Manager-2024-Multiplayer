[package]
name = "coop-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "coop_agent"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
coop-proto = { path = "../coop-proto" }
coop-mem = { path = "../coop-mem" }
coop-auth = { path = "../coop-auth" }
# The relay, so the agent can host without a second program. This is the whole point of the supervisor being a
# library as well as a binary: a player should launch the game, not the game plus a relay.
coop-supervisor = { path = "../coop-supervisor" }
